<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galleria | AURA</title>
    <meta name="description" content="AURA - Galleria.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="preloader">AURA.</div>
    <div id="cursor" class="custom-cursor"></div>
    <div id="cursor-follower" class="custom-cursor-follower"></div>

    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">AURA.</a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">La Storia</a></li>
                <li><a href="menu.html" class="nav-item">Menu</a></li>
                <li><a href="gallery.html" class="nav-item">Galleria</a></li>
                <li><a href="contact.html" class="nav-item btn-primary">Prenota</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="stack-container" style="padding-top: 100px;">
        <section id="gallery" class="gallery section stack-section">
            <div class="container">
                <div class="section-header scroll-reveal">
                    <h2 class="section-title scroll-reveal-text"><span class="text-inner">Galleria</span></h2>
                    <p class="section-subtitle">L'atmosfera che ci distingue.</p>
                </div>
                <div class="gallery-grid">
                    <div class="gallery-item scroll-reveal"><img src="assets/gallery1.png" alt="Gallery Image 1" class="gallery-img"></div>
                    <div class="gallery-item scroll-reveal delay-1"><img src="assets/dish1.png" alt="Gallery Image 2" class="gallery-img"></div>
                    <div class="gallery-item scroll-reveal"><img src="assets/hero.png" alt="Gallery Image 3" class="gallery-img"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <div class="footer-logo">AURA.</div>
            <div class="footer-social">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
            </div>
            <div class="footer-copy">
                &copy; 2026 AURA Restaurant. Tutti i diritti riservati.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
